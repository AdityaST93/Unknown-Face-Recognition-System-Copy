[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unknown-face-recognition-system"
version = "0.2.0"
description = "Local open-set face recognition with OpenCV YuNet and SFace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<5",
]
license = { text = "MIT" }
authors = [{ name = "Unknown Face Recognition contributors" }]
keywords = ["opencv", "face-recognition", "computer-vision", "unknown-person"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.scripts]
unknown-face = "unknown_face_recognition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
